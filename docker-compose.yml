services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build: ./backend
    environment:
      - NODE_ENV=production
      - KAFKAJS_NO_PARTITIONER_WARNING=1
      - PORT=5000
      - DB_HOST=db
      - DB_USER=airwise
      - DB_PASSWORD=airwise_password
      - DB_NAME=airwise_db
      - KAFKA_BROKER=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "5000:5000"
    depends_on:
      - db
      - kafka
      - zookeeper
      - redis
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: mysql:8
    container_name: mysql-db
    restart: always
    ports:
      - "3306:3306" # Expose on 3307 to avoid conflict with local MySQL on 3306
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=airwise_db
      - MYSQL_USER=airwise
      - MYSQL_PASSWORD=airwise_password
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network

  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - app-network
    restart: unless-stopped

  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "air-quality-data:1:1,air-quality-predictions:1:1"
      KAFKA_BROKER_ID: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - zookeeper
    networks:
      - app-network
    restart: unless-stopped

  ml-service:
    build: ./ml-service
    environment:
      - KAFKA_BROKER=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - kafka
    networks:
      - app-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_USER=airwise
      - PMA_PASSWORD=airwise_password
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
