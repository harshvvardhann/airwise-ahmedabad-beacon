
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airwise-redis
  labels:
    app: airwise-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airwise-redis
  template:
    metadata:
      labels:
        app: airwise-redis
    spec:
      containers:
      - name: redis
        image: redis:alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: airwise-redis
spec:
  selector:
    app: airwise-redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP
