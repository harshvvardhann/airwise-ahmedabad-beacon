
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airwise-frontend
  labels:
    app: airwise-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airwise-frontend
  template:
    metadata:
      labels:
        app: airwise-frontend
    spec:
      containers:
      - name: airwise-frontend
        image: airwise-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: airwise-frontend
spec:
  selector:
    app: airwise-frontend
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer
