
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airwise-zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airwise-zookeeper
  template:
    metadata:
      labels:
        app: airwise-zookeeper
    spec:
      containers:
      - name: zookeeper
        image: wurstmeister/zookeeper
        ports:
        - containerPort: 2181
---
apiVersion: v1
kind: Service
metadata:
  name: airwise-zookeeper
spec:
  selector:
    app: airwise-zookeeper
  ports:
  - port: 2181
    targetPort: 2181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airwise-kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airwise-kafka
  template:
    metadata:
      labels:
        app: airwise-kafka
    spec:
      containers:
      - name: kafka
        image: wurstmeister/kafka
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_ADVERTISED_HOST_NAME
          value: "airwise-kafka"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "airwise-zookeeper:2181"
        - name: KAFKA_CREATE_TOPICS
          value: "air-quality-data:1:1,air-quality-predictions:1:1"
---
apiVersion: v1
kind: Service
metadata:
  name: airwise-kafka
spec:
  selector:
    app: airwise-kafka
  ports:
  - port: 9092
    targetPort: 9092
