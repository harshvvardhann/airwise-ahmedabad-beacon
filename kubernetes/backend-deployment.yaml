
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airwise-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airwise-backend
  template:
    metadata:
      labels:
        app: airwise-backend
    spec:
      containers:
      - name: airwise-backend
        image: airwise-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        - name: DB_HOST
          value: airwise-mysql
        - name: DB_USER
          value: airwise
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: password
        - name: DB_NAME
          value: airwise_db
        - name: KAFKA_BROKER
          value: "airwise-kafka:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: airwise-backend
spec:
  selector:
    app: airwise-backend
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP
